<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182230;background:#f5f7fa}
    body{margin:0}.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
    a{color:#155eef}h1{margin:.4rem 0}.muted{color:#526174;font-size:14px;line-height:1.5}
    .panel{background:white;border:1px solid #dfe5ec;border-radius:14px;padding:24px;margin-top:20px}
    label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}.field{margin-bottom:18px}
    input[type=text],input[type=date]{width:100%;box-sizing:border-box;border:1px solid #cfd8e3;border-radius:9px;padding:11px;font:inherit}
    .check{display:flex;align-items:center;gap:10px}.check label{margin:0}
    .btn{background:#155eef;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer}
    .error{background:#fff0f0;color:#b42318;border:1px solid #f2b8b5;border-radius:9px;padding:12px;margin-bottom:18px}
  </style>
</head>
<body>
  <main class="wrap">
    <p><a href="/web/">Dashboard</a> / <a href="{{ '/web/employees/' if 'Karyawan' in title else '/web/suppliers/' }}">Kembali ke daftar</a></p>
    <h1>{{ title }}</h1><p class="muted">{{ description }}</p>
    <section class="panel">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="{{ action_url }}">
        {% for field in fields %}
          <div class="field">
          {% if field.type == 'checkbox' %}
            <div class="check"><input id="{{ field.name }}" name="{{ field.name }}" type="checkbox" value="true" {% if field.checked %}checked{% endif %}><label for="{{ field.name }}">{{ field.label }}</label></div>
          {% else %}
            <label for="{{ field.name }}">{{ field.label }}</label>
            <input id="{{ field.name }}" name="{{ field.name }}" type="{{ field.type }}" value="{{ field.value }}" {% if field.required %}required{% endif %}>
          {% endif %}
          </div>
        {% endfor %}
        <button class="btn" type="submit">{{ submit_label }}</button>
      </form>
    </section>
    <p class="muted">Gunakan data fiktif untuk latihan sinkronisasi API.</p>
  </main>
</body>
</html>
